name: ai-community-mysql8

services:
  mysql8:
    image: mysql:8.0
    container_name: ai-community-mysql8
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_community
      MYSQL_USER: ai
      MYSQL_PASSWORD: ai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - ai_community_mysql8_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uai", "-pai"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  ai_community_mysql8_data:
