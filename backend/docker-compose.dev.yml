name: ai-community

services:
  mysql:
    image: mariadb:11.4
    container_name: ai-community-mysql
    restart: unless-stopped
    ports:
      # Host 3307 avoids clash with local Windows MySQL on 3306
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_community
      MYSQL_USER: ai
      MYSQL_PASSWORD: ai
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ai_community_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  ai_community_mysql_data:
